<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Lucketts Elementary PTA Turkey Drive</title>
  <meta name="description" content="Help make Thanksgiving brighter for local families through the Lucketts Elementary PTA Turkey Drive." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://luckettsturkeydrive.org/" />
  <meta property="og:title" content="Lucketts Elementary PTA Turkey Drive" />
  <meta property="og:description" content="Help make Thanksgiving brighter for local families through the Lucketts Elementary PTA Turkey Drive." />
</head>
<body>
  <header role="banner">
    <div id="matching-banner" style="display:none;" aria-live="polite">
      <p id="matching-text"></p>
      <p id="countdown"></p>
    </div>
    <h1 id="site-title">Lucketts Elementary PTA Turkey Drive</h1>
    <p id="beneficiary"></p>
  </header>

  <main role="main">
    <section id="campaign-message" class="campaign-message" aria-live="polite">
      <p id="drive-message"></p>
      <p id="campaign-dates" class="campaign-dates"></p>
    </section>

    <section id="previous-impact" class="previous-impact" style="display:none;">
      <p id="previous-impact-text"></p>
    </section>

    <section id="donate" aria-labelledby="donate-heading">
      <h2 id="donate-heading" class="visually-hidden">Donate Section</h2>
      <p id="donation-copy"></p>
      <a id="donate-link" href="#" target="_blank" rel="noopener noreferrer">
        <button id="donate-button">Donate</button>
      </a>
    </section>

    <section id="tracker" aria-labelledby="tracker-heading">
      <h2 id="tracker-heading">Goal</h2>
      <div class="tracker-card">
        <div id="thermo-wrapper" role="progressbar" aria-label="Families supported toward the Turkey Drive goal" aria-valuemin="0" aria-valuemax="200" aria-valuenow="0">
          <div id="thermo-outline" aria-hidden="true">
            <div id="thermo-tube">
              <div id="thermo-fill"></div>
            </div>
            <div id="thermo-bulb"></div>
            <div id="thermo-scale"></div>
          </div>
        </div>
        <div class="tracker-summary">
          <p class="tracker-eyebrow">Our community, making a difference</p>
          <div class="tracker-total">
            <strong id="families-count">0</strong>
            <span>of <strong id="families-goal">200</strong> families</span>
          </div>
          <div class="tracker-percentage">
            <strong id="goal-percentage">0%</strong>
            <span>of our goal reached</span>
          </div>
          <p id="families-remaining" class="families-remaining">Every turkey counts!</p>
          <p id="progress-text" aria-live="polite">Loading...</p>
          <p id="last-updated"></p>
        </div>
      </div>
    </section>

    <section id="reach-goals" aria-labelledby="goals-heading">
      <h3 id="goals-heading">🎯 Community Reach Goals</h3>
      <ul id="goal-list" aria-live="polite"></ul>
    </section>
  </main>

  <footer role="contentinfo">
    <p id="footer-tags">#Lucketts #ThankfulTogether</p>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
